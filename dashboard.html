<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة الإدارة - دير الأنبا هيرمينا</title>

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Cairo", sans-serif;
        background: linear-gradient(135deg, #f8f6f0 0%, #e8e2d5 100%);
        color: #4a4037;
        min-height: 100vh;
        padding: 20px;
      }

      .floating-cross {
        position: fixed;
        top: 20px;
        left: 20px;
        font-size: 24px;
        color: rgba(139, 69, 19, 0.3);
        z-index: 1;
        animation: gentle-float 6s ease-in-out infinite;
      }

      @keyframes gentle-float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      @keyframes fade-in-up {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        animation: fade-in-up 0.8s ease-out;
      }

      .dashboard-header {
        background: linear-gradient(
          135deg,
          #8b4513 0%,
          #a0522d 50%,
          #cd853f 100%
        );
        color: white;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(139, 69, 19, 0.3);
        margin-bottom: 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 20px;
      }

      .header-info h1 {
        font-family: "Amiri", serif;
        font-size: 2.2em;
        margin-bottom: 8px;
      }

      .header-info .user-email {
        opacity: 0.9;
        font-size: 0.95em;
      }

      .header-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .btn {
        padding: 12px 20px;
        border: none;
        border-radius: 12px;
        font-weight: 800;
        cursor: pointer;
        font-family: "Cairo", sans-serif;
        transition: all 0.3s ease;
        font-size: 0.95em;
      }

      .btn-primary {
        background: white;
        color: #8b4513;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.2);
        color: white;
        border: 2px solid white;
      }

      .btn-secondary:hover {
        background: white;
        color: #8b4513;
      }

      .card {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(139, 69, 19, 0.1);
        margin-bottom: 30px;
        border: 2px solid rgba(139, 69, 19, 0.1);
      }

      .card-title {
        font-family: "Amiri", serif;
        font-size: 1.8em;
        color: #8b4513;
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 2px solid rgba(139, 69, 19, 0.2);
      }

      .form-group {
        margin-bottom: 22px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 800;
        color: #4a4037;
        font-size: 0.95em;
      }

      input[type="text"],
      input[type="number"],
      textarea {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid rgba(139, 69, 19, 0.2);
        border-radius: 12px;
        font-size: 16px;
        font-family: "Cairo", sans-serif;
        transition: all 0.3s ease;
        background: rgba(255, 255, 255, 0.9);
      }

      input:focus,
      textarea:focus {
        outline: none;
        border-color: #8b4513;
        box-shadow: 0 0 0 3px rgba(139, 69, 19, 0.1);
        background: white;
      }

      textarea {
        min-height: 100px;
        resize: vertical;
      }

      input[type="file"] {
        width: 100%;
        padding: 12px;
        border: 2px dashed rgba(139, 69, 19, 0.3);
        border-radius: 12px;
        font-family: "Cairo", sans-serif;
        cursor: pointer;
        background: rgba(139, 69, 19, 0.05);
        transition: all 0.3s ease;
      }

      input[type="file"]:hover {
        border-color: #8b4513;
        background: rgba(139, 69, 19, 0.1);
      }

      .btn-add {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1.1em;
        font-weight: 900;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
        box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        font-family: "Cairo", sans-serif;
      }

      .btn-add:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
      }

      .btn-add:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .message {
        margin-top: 20px;
        padding: 14px;
        border-radius: 10px;
        text-align: center;
        line-height: 1.6;
        font-size: 0.95em;
        display: none;
      }

      .message.show {
        display: block;
        animation: fade-in-up 0.5s ease-out;
      }

      .message.error {
        background: rgba(220, 53, 69, 0.1);
        color: #dc3545;
        border: 1px solid rgba(220, 53, 69, 0.3);
      }

      .message.success {
        background: rgba(40, 167, 69, 0.1);
        color: #28a745;
        border: 1px solid rgba(40, 167, 69, 0.3);
      }

      .message.info {
        background: rgba(139, 69, 19, 0.1);
        color: #8b4513;
        border: 1px solid rgba(139, 69, 19, 0.3);
      }

      .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        margin-top: 20px;
      }

      .product-item {
        background: white;
        border: 2px solid rgba(139, 69, 19, 0.1);
        border-radius: 16px;
        padding: 16px;
        transition: all 0.3s ease;
        animation: fade-in-up 0.6s ease-out both;
      }

      .product-item:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(139, 69, 19, 0.15);
        border-color: #8b4513;
      }

      .product-item img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-radius: 12px;
        margin-bottom: 12px;
      }

      .product-name {
        font-size: 1.2em;
        font-weight: 800;
        color: #8b4513;
        margin-bottom: 8px;
      }

      .product-description {
        font-size: 0.9em;
        color: #666;
        margin-bottom: 12px;
        min-height: 40px;
      }

      .product-price {
        font-size: 1.3em;
        font-weight: 900;
        color: #25d366;
        margin-bottom: 12px;
      }

      .product-actions {
        display: flex;
        gap: 8px;
      }

      .btn-edit {
        flex: 1;
        padding: 10px;
        background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
        transition: all 0.3s ease;
        font-family: "Cairo", sans-serif;
      }

      .btn-edit:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(74, 144, 226, 0.4);
      }

      .btn-delete {
        flex: 1;
        padding: 10px;
        background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
        transition: all 0.3s ease;
        font-family: "Cairo", sans-serif;
      }

      .btn-delete:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(220, 53, 69, 0.4);
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: #8b4513;
        font-size: 1.2em;
      }

      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #666;
      }

      .empty-state-icon {
        font-size: 4em;
        margin-bottom: 15px;
      }

      /* Modal Styles */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 1000;
        justify-content: center;
        align-items: center;
      }

      .modal.show {
        display: flex;
      }

      .modal-content {
        background: white;
        padding: 30px;
        border-radius: 20px;
        max-width: 600px;
        width: 90%;
        max-height: 90vh;
        overflow-y: auto;
        position: relative;
        animation: fade-in-up 0.3s ease-out;
      }

      .modal-close {
        position: absolute;
        top: 15px;
        left: 15px;
        background: #dc3545;
        color: white;
        border: none;
        width: 35px;
        height: 35px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 1.2em;
        font-weight: bold;
      }

      .modal-close:hover {
        background: #c82333;
      }

      .modal-title {
        font-family: "Amiri", serif;
        font-size: 1.8em;
        color: #8b4513;
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 2px solid rgba(139, 69, 19, 0.2);
      }

      @media (max-width: 768px) {
        .dashboard-header {
          text-align: center;
        }

        .header-info h1 {
          font-size: 1.8em;
        }

        .products-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>

    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

      const SUPABASE_URL = "https://dgvzbitxvdstfqgcpesf.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRndnpiaXR4dmRzdGZxZ2NwZXNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxNTYzMTEsImV4cCI6MjA4NTczMjMxMX0.pYSahUILeL-uit0CYEiXS01V1XKFNyFaNWE-ZkP_vzA";

      const BUCKET = "product-images";

      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const $ = (id) => document.getElementById(id);

      function showMessage(text, type = "info") {
        const msg = $("message");
        msg.textContent = text;
        msg.className = `message show ${type}`;

        // Auto-hide after 5 seconds
        setTimeout(() => {
          msg.classList.remove("show");
        }, 5000);
      }

      function hideMessage() {
        const msg = $("message");
        msg.classList.remove("show");
      }

      // فحص إذا كان المستخدم مسجل دخول
      async function requireAuth() {
        const {
          data: { session },
        } = await supabase.auth.getSession();
        if (!session) {
          location.href = "login.html";
          return null;
        }
        $("userEmail").textContent = session.user.email;
        return session;
      }

      // تحويل اسم المنتج لاسم آمن للملف
      function safeName(name) {
        return name
          .toLowerCase()
          .trim()
          .replace(/\s+/g, "-")
          .replace(/[^\w\-]+/g, "")
          .replace(/\-+/g, "-");
      }

      // رفع الصورة
      async function uploadImage(file, productName) {
        const ext = file.name.split(".").pop();
        const timestamp = Date.now();
        const randomId = Math.random().toString(36).substring(2, 9);
        const path = `Images/${safeName(productName)}-${timestamp}-${randomId}.${ext}`;

        const { error: upErr } = await supabase.storage
          .from(BUCKET)
          .upload(path, file, {
            cacheControl: "3600",
            upsert: false,
          });

        if (upErr) throw upErr;

        const { data } = supabase.storage.from(BUCKET).getPublicUrl(path);
        return data.publicUrl;
      }

      // حذف الصورة القديمة من التخزين
      async function deleteOldImage(imageUrl) {
        if (!imageUrl) return;

        try {
          // استخراج المسار من الرابط
          let filePath = "";

          // صيغة 1: الرابط الكامل من Supabase Storage
          if (imageUrl.includes("/storage/v1/object/public/product-images/")) {
            const urlParts = imageUrl.split(
              "/storage/v1/object/public/product-images/",
            );
            filePath = urlParts[1];
          }
          // صيغة 2: الرابط الكامل مع اسم bucket مختلف
          else if (imageUrl.includes("/storage/v1/object/public/")) {
            const match = imageUrl.match(
              /\/storage\/v1\/object\/public\/[^/]+\/(.+)$/,
            );
            if (match) filePath = match[1];
          }
          // صيغة 3: المسار المباشر (Images/...)
          else if (imageUrl.startsWith("Images/")) {
            filePath = imageUrl;
          }

          if (!filePath) {
            console.warn("⚠️ لا يمكن استخراج مسار الصورة من:", imageUrl);
            return;
          }

          console.log("🗑️ جاري حذف الصورة:", filePath);

          const { data, error } = await supabase.storage
            .from(BUCKET)
            .remove([filePath]);

          if (error) {
            console.error("❌ خطأ في حذف الصورة:", error);
          } else {
            console.log("✅ تم حذف الصورة بنجاح");
          }
        } catch (e) {
          console.error("❌ خطأ غير متوقع في حذف الصورة:", e);
        }
      }

      // تحميل المنتجات
      async function loadProducts() {
        const productsGrid = $("productsGrid");
        productsGrid.innerHTML =
          '<div class="loading">جاري تحميل المنتجات...</div>';

        const { data, error } = await supabase
          .from("products")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) {
          productsGrid.innerHTML =
            '<div class="empty-state"><div class="empty-state-icon">❌</div><div>حدث خطأ في تحميل المنتجات</div></div>';
          showMessage("❌ خطأ في تحميل المنتجات: " + error.message, "error");
          return;
        }

        if (data.length === 0) {
          productsGrid.innerHTML =
            '<div class="empty-state"><div class="empty-state-icon">📦</div><div>لا توجد منتجات بعد. ابدأ بإضافة منتج جديد!</div></div>';
          return;
        }

        productsGrid.innerHTML = "";
        data.forEach((product, index) => {
          const div = document.createElement("div");
          div.className = "product-item";
          div.style.animationDelay = `${index * 0.1}s`;

          div.innerHTML = `
          <img src="${product.image_url}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/300x200?text=صورة+غير+متاحة'">
          <div class="product-name">${product.name}</div>
          <div class="product-description">${product.description || "لا يوجد وصف"}</div>
          <div class="product-price">${product.retail_price} جنيه</div>
          <div class="product-actions">
            <button class="btn-edit" onclick="editProduct('${product.id}')">
              ✏️ تعديل
            </button>
            <button class="btn-delete" onclick="deleteProduct('${product.id}', '${product.name.replace(/'/g, "\\'")}', '${product.image_url}')">
              🗑️ حذف
            </button>
          </div>
        `;

          productsGrid.appendChild(div);
        });
      }

      // إضافة منتج جديد
      window.addProduct = async () => {
        const name = $("productName").value.trim();
        const description = $("productDescription").value.trim();
        const retailPrice = $("productPrice").value.trim();
        const file = $("productImage").files[0];
        const btn = $("addBtn");

        // التحقق من البيانات
        if (!name || !retailPrice || !file) {
          showMessage("⚠️ برجاء إدخال اسم المنتج والسعر واختيار صورة", "error");
          return;
        }

        if (isNaN(retailPrice) || Number(retailPrice) <= 0) {
          showMessage("⚠️ السعر يجب أن يكون رقم أكبر من صفر", "error");
          return;
        }

        // التحقق من نوع الملف
        const allowedTypes = [
          "image/jpeg",
          "image/jpg",
          "image/png",
          "image/webp",
        ];
        if (!allowedTypes.includes(file.type)) {
          showMessage("⚠️ يرجى اختيار صورة بصيغة JPG أو PNG أو WEBP", "error");
          return;
        }

        // التحقق من حجم الملف (5MB)
        if (file.size > 5 * 1024 * 1024) {
          showMessage("⚠️ حجم الصورة يجب أن يكون أقل من 5 ميجابايت", "error");
          return;
        }

        btn.disabled = true;
        btn.textContent = "جاري الإضافة...";
        showMessage("جاري رفع الصورة وإضافة المنتج...", "info");

        try {
          // رفع الصورة
          const imageUrl = await uploadImage(file, name);

          // إضافة المنتج إلى قاعدة البيانات
          const { error } = await supabase.from("products").insert([
            {
              name,
              description: description || null,
              retail_price: Number(retailPrice),
              image_url: imageUrl,
            },
          ]);

          if (error) throw error;

          showMessage("✅ تم إضافة المنتج بنجاح!", "success");

          // إعادة تعيين النموذج
          $("productName").value = "";
          $("productDescription").value = "";
          $("productPrice").value = "";
          $("productImage").value = "";

          // إعادة تحميل المنتجات
          await loadProducts();
        } catch (e) {
          showMessage("❌ حدث خطأ: " + (e?.message || e), "error");
        } finally {
          btn.disabled = false;
          btn.textContent = "➕ إضافة المنتج";
        }
      };

      // تعديل منتج
      window.editProduct = async (productId) => {
        // جلب بيانات المنتج
        const { data: product, error } = await supabase
          .from("products")
          .select("*")
          .eq("id", productId)
          .single();

        if (error || !product) {
          showMessage("❌ خطأ في جلب بيانات المنتج", "error");
          return;
        }

        // ملء النموذج في النافذة المنبثقة
        $("editProductId").value = product.id;
        $("editProductName").value = product.name;
        $("editProductDescription").value = product.description || "";
        $("editProductPrice").value = product.retail_price;
        $("editCurrentImageUrl").value = product.image_url;

        // عرض النافذة المنبثقة
        $("editModal").classList.add("show");
      };

      // حفظ التعديلات
      window.saveEdit = async () => {
        const productId = $("editProductId").value;
        const name = $("editProductName").value.trim();
        const description = $("editProductDescription").value.trim();
        const retailPrice = $("editProductPrice").value.trim();
        const file = $("editProductImage").files[0];
        const currentImageUrl = $("editCurrentImageUrl").value;
        const btn = $("saveEditBtn");

        // التحقق من البيانات
        if (!name || !retailPrice) {
          showMessage("⚠️ برجاء إدخال اسم المنتج والسعر", "error");
          return;
        }

        if (isNaN(retailPrice) || Number(retailPrice) <= 0) {
          showMessage("⚠️ السعر يجب أن يكون رقم أكبر من صفر", "error");
          return;
        }

        btn.disabled = true;
        btn.textContent = "جاري الحفظ...";
        showMessage("جاري حفظ التعديلات...", "info");

        try {
          let imageUrl = currentImageUrl;

          // إذا تم اختيار صورة جديدة
          if (file) {
            // التحقق من نوع الملف
            const allowedTypes = [
              "image/jpeg",
              "image/jpg",
              "image/png",
              "image/webp",
            ];
            if (!allowedTypes.includes(file.type)) {
              showMessage(
                "⚠️ يرجى اختيار صورة بصيغة JPG أو PNG أو WEBP",
                "error",
              );
              btn.disabled = false;
              btn.textContent = "💾 حفظ التعديلات";
              return;
            }

            // التحقق من حجم الملف (5MB)
            if (file.size > 5 * 1024 * 1024) {
              showMessage(
                "⚠️ حجم الصورة يجب أن يكون أقل من 5 ميجابايت",
                "error",
              );
              btn.disabled = false;
              btn.textContent = "💾 حفظ التعديلات";
              return;
            }

            // رفع الصورة الجديدة
            imageUrl = await uploadImage(file, name);

            // حذف الصورة القديمة
            await deleteOldImage(currentImageUrl);
          }

          // تحديث المنتج في قاعدة البيانات
          const { error } = await supabase
            .from("products")
            .update({
              name,
              description: description || null,
              retail_price: Number(retailPrice),
              image_url: imageUrl,
            })
            .eq("id", productId);

          if (error) throw error;

          showMessage("✅ تم حفظ التعديلات بنجاح!", "success");

          // إغلاق النافذة المنبثقة
          closeEditModal();

          // إعادة تحميل المنتجات
          await loadProducts();
        } catch (e) {
          showMessage("❌ حدث خطأ: " + (e?.message || e), "error");
        } finally {
          btn.disabled = false;
          btn.textContent = "💾 حفظ التعديلات";
        }
      };

      // إغلاق نافذة التعديل
      window.closeEditModal = () => {
        $("editModal").classList.remove("show");
        $("editProductImage").value = "";
      };

      // حذف منتج
      window.deleteProduct = async (productId, productName, imageUrl) => {
        if (
          !confirm(
            `هل أنت متأكد من حذف "${productName}"؟\n\nهذا الإجراء لا يمكن التراجع عنه.`,
          )
        ) {
          return;
        }

        showMessage("جاري حذف المنتج...", "info");

        try {
          // حذف المنتج من قاعدة البيانات
          const { error } = await supabase
            .from("products")
            .delete()
            .eq("id", productId);

          if (error) throw error;

          // حذف الصورة من التخزين
          await deleteOldImage(imageUrl);

          showMessage("✅ تم حذف المنتج بنجاح", "success");
          await loadProducts();
        } catch (e) {
          showMessage("❌ خطأ في حذف المنتج: " + (e?.message || e), "error");
        }
      };

      // تسجيل الخروج
      window.logout = async () => {
        if (!confirm("هل أنت متأكد من تسجيل الخروج؟")) {
          return;
        }

        await supabase.auth.signOut();
        location.href = "login.html";
      };

      // عند تحميل الصفحة
      window.addEventListener("DOMContentLoaded", async () => {
        const session = await requireAuth();
        if (session) {
          await loadProducts();
        }
      });
    </script>
  </head>

  <body>
    <div class="floating-cross">✝</div>

    <div class="container">
      <div class="dashboard-header">
        <div class="header-info">
          <h1>لوحة إدارة المنتجات</h1>
          <div class="user-email">مسجل دخول: <span id="userEmail"></span></div>
        </div>
        <div class="header-actions">
          <button
            class="btn btn-primary"
            onclick="location.href = 'index.html'"
          >
            🏠 فتح الموقع
          </button>
          <button class="btn btn-secondary" onclick="logout()">
            🚪 تسجيل خروج
          </button>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">➕ إضافة منتج جديد</h2>

        <div class="form-group">
          <label for="productName">اسم المنتج *</label>
          <input
            type="text"
            id="productName"
            placeholder="مثال: كيلو كشك"
            required
          />
        </div>

        <div class="form-group">
          <label for="productDescription">وصف المنتج</label>
          <textarea
            id="productDescription"
            placeholder="وصف مختصر عن المنتج وفوائده..."
          ></textarea>
        </div>

        <div class="form-group">
          <label for="productPrice">السعر (جنيه) *</label>
          <input
            type="number"
            id="productPrice"
            step="1"
            min="1"
            placeholder="120"
            required
          />
        </div>

        <div class="form-group">
          <label for="productImage"
            >صورة المنتج * (JPG, PNG, WEBP - حد أقصى 5MB)</label
          >
          <input
            type="file"
            id="productImage"
            accept="image/jpeg,image/jpg,image/png,image/webp"
            required
          />
        </div>

        <button id="addBtn" class="btn-add" onclick="addProduct()">
          ➕ إضافة المنتج
        </button>

        <div id="message" class="message"></div>
      </div>

      <div class="card">
        <h2 class="card-title">📦 المنتجات الحالية</h2>
        <div id="productsGrid" class="products-grid">
          <div class="loading">جاري التحميل...</div>
        </div>
      </div>
    </div>

    <!-- نافذة التعديل المنبثقة -->
    <div id="editModal" class="modal">
      <div class="modal-content">
        <button class="modal-close" onclick="closeEditModal()">×</button>
        <h2 class="modal-title">✏️ تعديل المنتج</h2>

        <input type="hidden" id="editProductId" />
        <input type="hidden" id="editCurrentImageUrl" />

        <div class="form-group">
          <label for="editProductName">اسم المنتج *</label>
          <input type="text" id="editProductName" required />
        </div>

        <div class="form-group">
          <label for="editProductDescription">وصف المنتج</label>
          <textarea id="editProductDescription"></textarea>
        </div>

        <div class="form-group">
          <label for="editProductPrice">السعر (جنيه) *</label>
          <input
            type="number"
            id="editProductPrice"
            step="1"
            min="1"
            required
          />
        </div>

        <div class="form-group">
          <label for="editProductImage"
            >صورة جديدة (اختياري - JPG, PNG, WEBP - حد أقصى 5MB)</label
          >
          <input
            type="file"
            id="editProductImage"
            accept="image/jpeg,image/jpg,image/png,image/webp"
          />
        </div>

        <button id="saveEditBtn" class="btn-add" onclick="saveEdit()">
          💾 حفظ التعديلات
        </button>
      </div>
    </div>
  </body>
</html>
